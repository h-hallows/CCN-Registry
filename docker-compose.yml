services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ccn
      POSTGRES_PASSWORD: ccn
      POSTGRES_DB: ccn_registry
    ports:
      - '5433:5432'
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ccn -d ccn_registry']
      interval: 2s
      timeout: 3s
      retries: 30
