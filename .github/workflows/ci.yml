name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Installs every workspace and links @ccn/core, so the console builds against the
      # library source rather than a published copy.
      - run: npm ci

      # I9, and the I1/I2/I7/I8 forbidden identifiers. Fails the build.
      - name: Copy lint
        run: npm run lint:copy

      - name: Typecheck
        run: npm run typecheck

      # The schema invariants live in @ccn/core so they cannot be weakened in one app
      # without the other noticing. They run against an in-memory Postgres with the real
      # migrations applied, so the triggers and constraints are exercised, not mocked.
      - name: Tests, including the invariant gate
        run: npm test

      - name: Build
        run: npm run build

  # Architecture spec § 8: migrations have exactly one owner.
  migrations-have-one-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No app may carry migrations or drizzle-kit
        run: |
          set -e
          if find apps -type d -name 'migrations' | grep -q .; then
            echo "An app contains a migrations directory. Migrations belong to @ccn/core."
            find apps -type d -name 'migrations'
            exit 1
          fi
          if grep -rl '"drizzle-kit"' apps/*/package.json 2>/dev/null | grep -q .; then
            echo "An app depends on drizzle-kit. Only @ccn/core may generate migrations."
            exit 1
          fi
          echo "ok: migrations and drizzle-kit live only in packages/core"

  # § 1812.533(c): a record of every advertisement, with date and publication, kept one
  # year. A website is an advertisement and it changes every deploy, so this is written
  # from CI — a manual log would not be kept, and a partial one is worse than none
  # because it implies the rest are reliable.
  record-advertisement:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record this deploy as an advertisement
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret; skipping. Set it so the § 1812.533(c) log is kept."
            exit 0
          fi
          npx tsx scripts/record-advertisement.mjs \
            --publication website --reference "$GITHUB_SHA" --recorded-by ci
