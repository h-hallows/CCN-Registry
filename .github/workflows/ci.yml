name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccn
          POSTGRES_PASSWORD: ccn
          POSTGRES_DB: ccn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # @h-hallows/core comes from a git tag over https, so this needs no credentials of
      # any kind. The repository is public and the tag is immutable.
      # npm records a GitHub git dependency in package-lock.json as git+ssh://, whatever
      # package.json says, and CI has no SSH key. This makes git use https for
      # github.com regardless, so `npm ci` resolves @h-hallows/core from the public
      # repository with no credentials at all. Harmless if npm ever stops doing it.
      - name: Resolve github git dependencies over https
        run: git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      # I9, and the I1/I2/I7/I8 forbidden identifiers. Fails the build.
      - name: Copy lint
        run: npm run lint:copy

      # Work order 01 § 3. The trading name is blocked on counsel, so nothing may
      # hardcode one — a literal would be a find-and-replace across every page and six
      # statutory documents if the name turns out not to be usable.
      # Was `--workspaces --if-present`, which silently did nothing: no workspace defined
      # a lint:brand script, so the console could have hardcoded the business name and CI
      # would have passed. Runs at the root now, where the script actually lives.
      - name: Brand lint
        run: npm run lint:brand

      - name: Typecheck
        run: npm run typecheck

      # The schema invariants live in @h-hallows/core so they cannot be weakened in one app
      # without the other noticing. They run against an in-memory Postgres with the real
      # migrations applied, so the triggers and constraints are exercised, not mocked.
      - name: Tests, including the invariant gate
        run: npm test

      # The same suite again, against a real Postgres 16.
      #
      # The default run uses in-memory PGlite, which is a WASM build of Postgres and
      # not the same thing. The invariants this codebase exists to enforce live in
      # triggers, CHECK constraints and row-level security, and PGlite has already
      # differed in ways that mattered: a nested transaction that works on a pooled
      # connection deadlocks on a single-connection one, and a TRUNCATE lock ordering
      # bug only ever appeared here. Running only the embedded driver means the layer
      # that carries the legal position is never exercised on the engine it ships on.
      - name: Tests against Postgres 16
        env:
          TEST_DATABASE_URL: postgres://ccn:ccn@localhost:5432/ccn_test
        run: npm test

      - name: Build
        run: npm run build

  # Architecture spec § 8: migrations have exactly one owner.
  migrations-have-one-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No app may carry migrations or drizzle-kit
        run: |
          set -e
          if find apps -type d -name 'migrations' | grep -q .; then
            echo "An app contains a migrations directory. Migrations belong to @h-hallows/core."
            find apps -type d -name 'migrations'
            exit 1
          fi
          if grep -rl '"drizzle-kit"' apps/*/package.json 2>/dev/null | grep -q .; then
            echo "An app depends on drizzle-kit. Only @h-hallows/core may generate migrations."
            exit 1
          fi
          echo "ok: migrations and drizzle-kit live only in @h-hallows/core, its own repository"

# § 1812.533(c) — a record of every advertisement, kept a year — is NOT recorded from
# here. The operator console is not an advertisement: it is behind a login, it is not
# offered to the public, and nothing in it solicits anyone. The public site is the
# advertisement, and that job lives in CCN-external, next to the
# scripts/record-advertisement.mjs it needs. This repository used to carry a copy of the
# job that named a script it does not have; it only ever passed because the step skips
# itself when no DATABASE_URL secret is set.
