name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # I9, and the I1/I2/I7/I8 forbidden identifiers. Fails the build.
      - name: Copy lint
        run: npm run lint:copy

      - name: Typecheck
        run: npm run typecheck

      # § 7.3 runs against an in-memory Postgres with the real migration applied, so the
      # append-only triggers and check constraints are exercised, not mocked.
      - name: Tests, including the invariant gate
        run: npm test

      - name: Build
        run: npm run build
